# ===============================
# Application
# ===============================
spring.application.name=gpi-golfe1

# ===============================
# Base de donnees PostgreSQL
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/gpi_golfe1
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
# validate : Hibernate verifie que les entites correspondent au schema
# cree a la main via database/schema.sql (MPD) - ne modifie jamais le schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===============================
# JWT
# ===============================
# A definir en variable d'environnement en production - ne jamais committer la vraie valeur.
jwt.secret=${JWT_SECRET:changez_moi_en_production_avec_une_cle_secrete_longue_et_aleatoire}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===============================
# CORS (a affiner selon l'URL du frontend)
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ===============================
# Serveur
# ===============================
server.port=${SERVER_PORT:8080}
