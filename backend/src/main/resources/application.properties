
# Application

spring.application.name=gpi-cg1


# Base de donnees PostgreSQL

spring.datasource.url=jdbc:postgresql://localhost:5432/gpi
spring.datasource.username=${DB_USERNAME:gpi}
spring.datasource.password=${DB_PASSWORD:gpi-cg1}
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA / Hibernate

# validate : Hibernate verifie que les entites correspondent au schema
# cree a la main via database/schema.sql (MPD) - schema à ne pas mofifier.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=gpi
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy


# JWT
jwt.secret=${JWT_SECRET:maSuperCleSecretePourGPI2026QuiDoitFaireAuMoins32Caracteres!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS (a affiner selon l'URL du frontend)

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}


# Serveur

server.port=${SERVER_PORT:8080}


# Upload de fichiers
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Dossier d'upload (optionnel, on le crée en code)
app.upload.dir=uploads/videos
